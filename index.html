<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="МоиМеста">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Мои Места</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root {
  --bg:#141a14;--surface:#1c251c;--card:#222d22;--border:#2c3a2c;--border2:#3a4a3a;
  --green:#6ab04c;--green-dim:#3d6b28;--blue:#4a9fd4;--amber:#e0a030;--red:#c0404a;
  --purple:#9b6dca;--brown:#a07040;--text:#dce8dc;--muted:#7a9070;--faint:#4a5a4a;
  --r:12px;--r-sm:8px;
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* HEADER */
#header{padding:calc(var(--safe-top) + 10px) 16px 10px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0;z-index:100}
.logo{width:36px;height:36px;background:linear-gradient(145deg,var(--green-dim),#2a4a1a);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.header-text{flex:1}.header-text h1{font-size:17px;font-weight:700;letter-spacing:-.3px}.header-text p{font-size:11px;color:var(--muted);margin-top:1px}
.header-actions{display:flex;gap:8px}
.icon-btn{width:36px;height:36px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.icon-btn:active{background:var(--border)}

/* FILTERS */
#filters{padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:6px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
#filters::-webkit-scrollbar{display:none}
.f-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.f-btn .f-icon{font-size:15px}
.f-btn.active{border-color:var(--green);color:var(--green);background:rgba(106,176,76,.12)}
.f-btn .f-count{background:var(--border2);border-radius:10px;padding:1px 6px;font-size:11px;color:var(--faint)}
.f-btn.active .f-count{background:rgba(106,176,76,.2);color:var(--green)}

/* MAP */
#map{flex:1;z-index:1}

/* FABs */
.fab-group{position:fixed;right:16px;bottom:calc(var(--safe-bot) + 16px);display:flex;flex-direction:column;align-items:center;gap:10px;z-index:500}
#fab-add{width:56px;height:56px;background:linear-gradient(145deg,var(--green),var(--green-dim));border:none;border-radius:18px;color:#fff;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(106,176,76,.4);transition:transform .15s}
#fab-add:active{transform:scale(.93)}
.fab-sm{width:44px;height:44px;background:var(--card);border:1px solid var(--border);border-radius:14px;color:var(--text);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.fab-sm:active{background:var(--border)}
#fab-list{position:fixed;left:16px;bottom:calc(var(--safe-bot) + 16px);width:44px;height:44px;background:var(--card);border:1px solid var(--border);border-radius:14px;color:var(--text);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.3);z-index:500}

/* OVERLAY & SHEET */
.sheet-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:800;backdrop-filter:blur(2px)}
.sheet-overlay.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--border);z-index:900;max-height:92dvh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);padding-bottom:var(--safe-bot)}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 0}
.sheet-header{padding:14px 20px 0;display:flex;align-items:center;gap:10px}
.sheet-header h2{font-size:18px;font-weight:700;flex:1}
.sheet-close{background:var(--card);border:1px solid var(--border);border-radius:8px;width:30px;height:30px;color:var(--muted);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sheet-body{padding:16px 20px 20px}

/* FORM */
.form-label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px;display:block}
.form-group{margin-bottom:18px}
.form-input,.form-textarea{width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text);padding:11px 14px;font-size:15px;font-family:inherit;outline:none;transition:border-color .15s}
.form-input:focus,.form-textarea:focus{border-color:var(--green)}
.form-input::placeholder,.form-textarea::placeholder{color:var(--faint)}
.form-textarea{resize:vertical;min-height:80px;line-height:1.5}

/* CATEGORIES */
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 6px;text-align:center;cursor:pointer;transition:all .15s}
.cat-item .ci{font-size:22px;display:block;margin-bottom:4px}
.cat-item .cl{font-size:12px;color:var(--muted)}
.cat-item.sel{border-color:var(--green);background:rgba(106,176,76,.1)}
.cat-item.sel .cl{color:var(--green)}

/* COORDS */
.coords-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 14px;font-family:'Courier New',monospace;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.coords-box span{flex:1}

/* PHOTO */
.photo-area{position:relative;width:100%;height:160px;background:var(--card);border:2px dashed var(--border);border-radius:var(--r-sm);overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;transition:border-color .15s}
.photo-area:hover{border-color:var(--green)}
.photo-area img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-area .ph-hint{font-size:13px;color:var(--muted);z-index:1}
.photo-area .ph-icon{font-size:28px;z-index:1}
.photo-area .ph-remove{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);border:none;border-radius:6px;color:#fff;width:28px;height:28px;font-size:14px;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center}

/* VISITS */
.visits-list{display:flex;flex-direction:column;gap:6px;max-height:120px;overflow-y:auto}
.visit-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 12px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.visit-del{background:none;border:none;color:var(--faint);cursor:pointer;font-size:16px}

/* BUTTONS */
.btn-row{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:13px;border-radius:var(--r-sm);border:none;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s}
.btn:active{opacity:.8;transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,var(--green),var(--green-dim));color:#fff}
.btn-ghost{background:var(--card);border:1px solid var(--border);color:var(--text)}
.btn-danger{background:rgba(192,64,74,.15);border:1px solid rgba(192,64,74,.3);color:var(--red)}
.btn-blue{background:rgba(74,159,212,.15);border:1px solid rgba(74,159,212,.3);color:var(--blue)}

/* ACTION BUTTONS ROW */
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.action-btn{padding:10px 8px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s}
.action-btn:active{background:var(--border)}
.action-btn.nav{border-color:rgba(74,159,212,.4);color:var(--blue);background:rgba(74,159,212,.08)}
.action-btn.share{border-color:rgba(106,176,76,.4);color:var(--green);background:rgba(106,176,76,.08)}
.action-btn.visit{border-color:rgba(224,160,48,.4);color:var(--amber);background:rgba(224,160,48,.08)}
.action-btn.weather{border-color:rgba(155,109,202,.4);color:var(--purple);background:rgba(155,109,202,.08)}

/* SIDEBAR */
#sidebar{position:fixed;top:0;left:0;bottom:0;width:min(320px,90vw);background:var(--surface);border-right:1px solid var(--border);z-index:1000;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .3s cubic-bezier(.32,.72,0,1);padding-top:var(--safe-top)}
#sidebar.open{transform:translateX(0)}
#sb-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
#sb-header h2{flex:1;font-size:17px;font-weight:700}
#sb-search{padding:10px 16px;border-bottom:1px solid var(--border)}
#sb-search input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 12px;color:var(--text);font-size:14px;font-family:inherit;outline:none}
#sb-search input:focus{border-color:var(--green)}
#sb-list{flex:1;overflow-y:auto}
.sb-item{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .1s}
.sb-item:active{background:var(--card)}
.sb-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.sb-info{flex:1;min-width:0}
.sb-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-meta{font-size:12px;color:var(--muted);margin-top:2px}
.sb-dist{font-size:11px;color:var(--green);margin-top:2px}
.sb-empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.sb-empty .se-icon{font-size:40px;display:block;margin-bottom:12px}

/* POPUP */
.leaflet-popup-content-wrapper{background:var(--card)!important;color:var(--text)!important;border:1px solid var(--border)!important;border-radius:var(--r)!important;box-shadow:0 8px 32px rgba(0,0,0,.6)!important;padding:0!important}
.leaflet-popup-content{margin:0!important;width:auto!important}
.leaflet-popup-tip-container{display:none}
.leaflet-popup-close-button{display:none!important}
.pop{padding:14px 16px;min-width:230px;max-width:290px}
.pop-photo{width:100%;height:130px;object-fit:cover;border-radius:var(--r-sm);margin-bottom:10px;display:block}
.pop-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.pop-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.pop-title-area{flex:1;min-width:0}
.pop-title{font-size:15px;font-weight:700;line-height:1.2}
.pop-cat{font-size:12px;color:var(--muted);margin-top:2px}
.pop-dist{font-size:12px;color:var(--green);margin-top:2px}
.pop-note{font-size:13px;color:var(--text);line-height:1.5;margin-bottom:8px;padding:8px 10px;background:var(--surface);border-radius:var(--r-sm);border-left:3px solid var(--green-dim)}
.pop-coords{font-size:11px;color:var(--faint);font-family:monospace;margin-bottom:4px}
.pop-date{font-size:11px;color:var(--faint);margin-bottom:10px}
.pop-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.pop-btn{padding:8px 6px;border-radius:var(--r-sm);border:1px solid var(--border);font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:background .15s;background:var(--card);color:var(--text)}
.pop-btn:active{background:var(--border)}
.pop-btn.nav{border-color:rgba(74,159,212,.4);color:var(--blue);background:rgba(74,159,212,.08)}
.pop-btn.share{border-color:rgba(106,176,76,.4);color:var(--green);background:rgba(106,176,76,.08)}
.pop-btn.visit{border-color:rgba(224,160,48,.4);color:var(--amber);background:rgba(224,160,48,.08)}
.pop-btn-row{display:flex;gap:6px}
.pop-btn-edit{flex:1;padding:8px;border-radius:var(--r-sm);border:1px solid var(--border);font-size:13px;font-weight:600;cursor:pointer;background:var(--card);color:var(--text)}
.pop-btn-del{padding:8px 12px;border-radius:var(--r-sm);border:1px solid rgba(192,64,74,.3);font-size:13px;cursor:pointer;background:rgba(192,64,74,.1);color:var(--red)}

/* WEATHER WIDGET */
.weather-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.weather-icon{font-size:28px}
.weather-info{flex:1}
.weather-temp{font-size:18px;font-weight:700}
.weather-desc{font-size:12px;color:var(--muted)}

/* SEASON BANNER */
#season-banner{background:linear-gradient(135deg,rgba(106,176,76,.15),rgba(61,107,40,.1));border-bottom:1px solid rgba(106,176,76,.2);padding:8px 16px;display:flex;align-items:center;gap:10px;font-size:13px;flex-shrink:0;cursor:pointer}
#season-banner.hidden{display:none}
.sb-dismiss{margin-left:auto;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer}

/* TABS in sheet */
.sheet-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin:12px 20px 0}
.sheet-tab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.sheet-tab.active{color:var(--green);border-bottom-color:var(--green)}
.tab-panel{display:none;padding:16px 20px 20px}
.tab-panel.active{display:block}

/* LEAFLET */
.leaflet-control-zoom a{background:var(--card)!important;color:var(--text)!important;border-color:var(--border)!important}
.leaflet-bar{border-color:var(--border)!important;box-shadow:0 2px 8px rgba(0,0,0,.3)!important}
.leaflet-control-attribution{background:rgba(20,26,20,.7)!important;color:var(--faint)!important;font-size:10px!important}
.leaflet-control-attribution img{display:none!important}

/* TOAST */
#toast{position:fixed;bottom:calc(var(--safe-bot) + 90px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--card);border:1px solid var(--border);border-radius:30px;padding:10px 20px;font-size:14px;color:var(--text);z-index:2000;opacity:0;transition:opacity .2s,transform .2s;white-space:nowrap;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* СПРАВОЧНИК */
.ref-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ref-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;cursor:pointer;transition:border-color .15s}
.ref-card:active{border-color:var(--green)}
.ref-card .rc-icon{font-size:28px;margin-bottom:6px}
.ref-card .rc-name{font-size:14px;font-weight:600;margin-bottom:3px}
.ref-card .rc-desc{font-size:12px;color:var(--muted);line-height:1.4}
.ref-detail{padding:16px 20px}
.ref-detail h3{font-size:18px;font-weight:700;margin-bottom:4px}
.ref-detail .rd-sub{font-size:13px;color:var(--muted);margin-bottom:12px}
.ref-detail p{font-size:14px;line-height:1.6;color:var(--text);margin-bottom:10px}
.ref-detail .rd-tag{display:inline-block;background:rgba(106,176,76,.15);border:1px solid rgba(106,176,76,.3);color:var(--green);border-radius:20px;padding:3px 10px;font-size:12px;margin:3px 3px 3px 0}
.ref-back{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:16px;background:none;border:none}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="logo">🧭</div>
    <div class="header-text">
      <h1>Мои Места</h1>
      <p id="hdr-sub">Загрузка...</p>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btn-ref" title="Справочник">🌿</button>
      <button class="icon-btn" id="btn-export" title="Экспорт">💾</button>
      <button class="icon-btn" id="btn-import" title="Импорт">📂</button>
    </div>
  </div>

  <div id="season-banner">
    <span id="season-icon">🍄</span>
    <span id="season-text">Сезон белых грибов!</span>
    <button class="sb-dismiss" id="season-dismiss">✕</button>
  </div>

  <div id="filters">
    <button class="f-btn active" data-cat="all"><span class="f-icon">🗺️</span>Все<span class="f-count" id="cnt-all">0</span></button>
    <button class="f-btn" data-cat="mushroom"><span class="f-icon">🍄</span>Грибы<span class="f-count" id="cnt-mushroom">0</span></button>
    <button class="f-btn" data-cat="fishing"><span class="f-icon">🎣</span>Рыбалка<span class="f-count" id="cnt-fishing">0</span></button>
    <button class="f-btn" data-cat="berry"><span class="f-icon">🫐</span>Ягоды<span class="f-count" id="cnt-berry">0</span></button>
    <button class="f-btn" data-cat="camp"><span class="f-icon">⛺</span>Стоянка<span class="f-count" id="cnt-camp">0</span></button>
    <button class="f-btn" data-cat="hunt"><span class="f-icon">🦌</span>Охота<span class="f-count" id="cnt-hunt">0</span></button>
    <button class="f-btn" data-cat="other"><span class="f-icon">📍</span>Другое<span class="f-count" id="cnt-other">0</span></button>
  </div>

  <div id="map"></div>
</div>

<div class="fab-group">
  <button class="fab-sm" id="fab-gps" title="Моё место">📡</button>
  <button id="fab-add" title="Добавить точку">＋</button>
</div>
<button id="fab-list" title="Список">☰</button>

<!-- Overlay -->
<div class="sheet-overlay" id="overlay"></div>

<!-- Add/Edit Sheet -->
<div class="sheet" id="sheet-add">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <h2 id="sh-title">Новая точка</h2>
    <button class="sheet-close" id="sh-close">✕</button>
  </div>
  <div class="sheet-tabs">
    <div class="sheet-tab active" data-tab="main">📍 Основное</div>
    <div class="sheet-tab" data-tab="photo">📸 Фото</div>
    <div class="sheet-tab" data-tab="visits">🗓️ Визиты</div>
  </div>

  <!-- TAB: Основное -->
  <div class="tab-panel active" id="tab-main">
    <div class="form-group">
      <label class="form-label">Название</label>
      <input class="form-input" id="f-name" placeholder="Например: Ельник у болота" autocomplete="off"/>
    </div>
    <div class="form-group">
      <label class="form-label">Категория</label>
      <div class="cat-grid">
        <div class="cat-item sel" data-cat="mushroom"><span class="ci">🍄</span><span class="cl">Грибы</span></div>
        <div class="cat-item" data-cat="fishing"><span class="ci">🎣</span><span class="cl">Рыбалка</span></div>
        <div class="cat-item" data-cat="berry"><span class="ci">🫐</span><span class="cl">Ягоды</span></div>
        <div class="cat-item" data-cat="camp"><span class="ci">⛺</span><span class="cl">Стоянка</span></div>
        <div class="cat-item" data-cat="hunt"><span class="ci">🦌</span><span class="cl">Охота</span></div>
        <div class="cat-item" data-cat="other"><span class="ci">📍</span><span class="cl">Другое</span></div>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Заметка</label>
      <textarea class="form-textarea" id="f-note" placeholder="Что нашёл, когда лучше приходить..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Координаты</label>
      <div class="coords-box"><span id="f-coords">—</span></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="sh-cancel">Отмена</button>
      <button class="btn btn-primary" id="sh-save">💾 Сохранить</button>
    </div>

      <button class="btn btn-danger" id="sh-delete" style="width:100%">🗑️ Удалить точку</button>
    </div>
  </div>

  <!-- TAB: Фото -->
  <div class="tab-panel" id="tab-photo">
    <div class="form-group">
      <label class="form-label">Фото места</label>
      <div class="photo-area" id="photo-area">
        <span class="ph-icon">📷</span>
        <span class="ph-hint">Нажми чтобы добавить фото</span>
        <button class="ph-remove" id="photo-remove" style="display:none">✕</button>
      </div>
      <input type="file" id="photo-input" accept="image/*" capture="environment" style="display:none">
    </div>
    <div style="font-size:13px;color:var(--muted);line-height:1.5">Фото сохраняется прямо в приложении и не отправляется в интернет.</div>

  <!-- TAB: Визиты -->
  <div class="tab-panel" id="tab-visits">

      <label class="form-label">История посещений</label>
      <div class="visits-list" id="visits-list"></div>

    <button class="btn btn-ghost" id="add-visit" style="width:100%">+ Отметить сегодняшний визит</button>

</div>

<!-- Sidebar -->
<div class="sheet-overlay" id="sb-overlay"></div>
<div id="sidebar">
  <div id="sb-header">
    <h2>Мои точки</h2>
    <button class="sheet-close" id="sb-close">✕</button>
  </div>
  <div id="sb-search"><input placeholder="🔍 Поиск..." id="sb-q" autocomplete="off"/></div>
  <div id="sb-list"></div>
</div>

<!-- Справочник Sheet -->
<div class="sheet-overlay" id="ref-overlay"></div>
<div class="sheet" id="sheet-ref">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <h2>🌿 Справочник</h2>
    <button class="sheet-close" id="ref-close">✕</button>
  </div>
  <div class="sheet-body" id="ref-body"></div>
</div>

<input type="file" id="import-input" accept=".json" style="display:none">
<div id="toast"></div>

<script>
'use strict';
const CATS={mushroom:{label:'Грибы',icon:'🍄',bg:'rgba(90,138,60,0.2)'},fishing:{label:'Рыбалка',icon:'🎣',bg:'rgba(58,122,181,0.2)'},berry:{label:'Ягоды',icon:'🫐',bg:'rgba(155,109,202,0.2)'},camp:{label:'Стоянка',icon:'⛺',bg:'rgba(200,120,50,0.2)'},hunt:{label:'Охота',icon:'🦌',bg:'rgba(160,112,64,0.2)'},other:{label:'Другое',icon:'📍',bg:'rgba(106,106,106,0.2)'}};

// Справочник
const REF={
  mushrooms:[
    {icon:'🍄',name:'Белый гриб',season:'Июль–Октябрь',where:'Хвойные и смешанные леса, под елями и соснами',desc:'Самый ценный гриб. Шляпка коричневая, ножка белая толстая. Не червивеет быстро.',tags:['Съедобный','1 категория','Сушат','Варят']},
    {icon:'🟡',name:'Лисичка',season:'Июнь–Октябрь',where:'Смешанные леса, часто семьями',desc:'Ярко-жёлтая, воронкообразная. Никогда не бывает червивой. Отличный вкус.',tags:['Съедобный','1 категория','Жарят']},
    {icon:'🟤',name:'Подосиновик',season:'Июль–Сентябрь',where:'Осиновые леса, смешанные',desc:'Шляпка красно-оранжевая. На срезе синеет. Крупный и мясистый.',tags:['Съедобный','2 категория','Варят','Жарят']},
    {icon:'🫚',name:'Маслёнок',season:'Июнь–Октябрь',where:'Сосновые леса, молодые посадки',desc:'Шляпка скользкая коричневая. Растут большими семьями. Кожицу снимают.',tags:['Съедобный','2 категория','Маринуют']},
    {icon:'🟫',name:'Опёнок',season:'Август–Ноябрь',where:'На пнях, поваленных деревьях',desc:'Растут большими группами. Кольцо на ножке. Не путать с ложными опятами.',tags:['Съедобный','3 категория','Маринуют']},
    {icon:'⚫',name:'Груздь',season:'Июль–Сентябрь',where:'Смешанные леса, под берёзами',desc:'Белый с мохнатым краем. Горький на вкус, требует вымачивания.',tags:['Съедобный','1 категория','Солят']},
  ],
  fish:[
    {icon:'🐟',name:'Щука',season:'Круглый год',where:'Заросли у берега, коряги, мелководье',desc:'Хищник. Лучший клёв ранним утром и вечером. Спиннинг, живцовая удочка.',tags:['Хищник','Спиннинг','Живец','До 15 кг']},
    {icon:'🐠',name:'Окунь',season:'Круглый год',where:'Подводные коряги, свалы глубины',desc:'Активен в любое время. Стайная рыба. Клюёт на червя, блесну, мормышку.',tags:['Хищник','Спиннинг','Мормышка','Стайный']},
    {icon:'🐡',name:'Карась',season:'Май–Октябрь',where:'Заросшие пруды, тихие заводи',desc:'Любит тёплую стоячую воду. Клюёт на хлеб, червя, перловку. Утром.',tags:['Мирный','Поплавок','Утро','Илистое дно']},
    {icon:'🐟',name:'Лещ',season:'Апрель–Октябрь',where:'Глубокие ямы, русло реки',desc:'Ночная и утренняя рыба. Фидер, донка. Любит ровное дно без течения.',tags:['Мирный','Фидер','Ночью','Глубина']},
    {icon:'🐟',name:'Судак',season:'Март–Ноябрь',where:'Глубокие ямы, чистая вода',desc:'Хищник. Активен на рассвете и закате. Джиг, воблер.',tags:['Хищник','Джиг','Воблер','Глубина']},
    {icon:'🐟',name:'Сазан',season:'Май–Октябрь',where:'Ямы с илистым дном, заросли',desc:'Осторожная рыба. Фидер с бойлами или кукурузой. Ночью активнее.',tags:['Мирный','Фидер','Бойлы','До 30 кг']},
  ]
};

function load(){try{return JSON.parse(localStorage.getItem('moi_mesta_v2')||'[]')}catch{return[]}}
function save(p){try{localStorage.setItem('moi_mesta_v2',JSON.stringify(p))}catch{}}

let points=load(),markers={},filter='all',editId=null,pendingLL=null,selCat='mushroom',photoData=null,editVisits=[],userPos=null;

// MAP
const map=L.map('map',{zoomControl:false}).setView([53.9,27.5],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© <a href="https://openstreetmap.org">OSM</a>',maxZoom:19}).addTo(map);
L.control.zoom({position:'topright'}).addTo(map);

// GPS watch
if(navigator.geolocation){
  navigator.geolocation.watchPosition(p=>{
    userPos={lat:p.coords.latitude,lng:p.coords.longitude};
    updateHeader();
    renderSidebar(document.getElementById('sb-q').value);
  },()=>{},{enableHighAccuracy:true,maximumAge:30000});
}

function dist(lat1,lng1,lat2,lng2){
  const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function fmtDist(km){return km<1?`${Math.round(km*1000)} м`:`${km.toFixed(1)} км`}
function fmtDate(ts){return new Date(ts).toLocaleDateString('ru-RU',{day:'2-digit',month:'long',year:'numeric'})}
function fmtCoords(lat,lng){return`${lat.toFixed(6)}°N, ${lng.toFixed(6)}°E`}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function plural(n,a,b,c){const m=n%100;if(m>=11&&m<=19)return c;const r=n%10;if(r===1)return a;if(r>=2&&r<=4)return b;return c}

function makeIcon(cat){
  const c=CATS[cat]||CATS.other;
  return L.divIcon({className:'',html:`<div style="font-size:28px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));line-height:1;cursor:pointer">${c.icon}</div>`,iconSize:[32,32],iconAnchor:[16,16],popupAnchor:[0,-20]});
}

function popupHtml(pt){
  const cat=CATS[pt.cat]||CATS.other;
  const d=userPos?fmtDist(dist(userPos.lat,userPos.lng,pt.lat,pt.lng)):'';
  const lastVisit=pt.visits&&pt.visits.length?`Последний визит: ${fmtDate(pt.visits[pt.visits.length-1])}`:'';
  return`<div class="pop">
    ${pt.photo?`<img class="pop-photo" src="${pt.photo}" alt="фото">`:''}
    <div class="pop-top">
      <div class="pop-icon" style="background:${cat.bg}">${cat.icon}</div>
      <div class="pop-title-area">
        <div class="pop-title">${escHtml(pt.name||'Без названия')}</div>
        <div class="pop-cat">${cat.label}</div>
        ${d?`<div class="pop-dist">📏 ${d} от вас</div>`:''}
      </div>
    </div>
    ${pt.note?`<div class="pop-note">${escHtml(pt.note)}</div>`:''}
    <div class="pop-coords">${fmtCoords(pt.lat,pt.lng)}</div>
    <div class="pop-date">📅 ${fmtDate(pt.ts)}${lastVisit?` · ${lastVisit}`:''}</div>
    <div class="pop-actions">
      <button class="pop-btn nav" onclick="navigate('${pt.id}')">🗺️ Маршрут</button>
      <button class="pop-btn share" onclick="sharePoint('${pt.id}')">📤 Поделиться</button>
      <button class="pop-btn visit" onclick="markVisit('${pt.id}')">✅ Я здесь</button>
      <button class="pop-btn" onclick="openEdit('${pt.id}')">✏️ Изменить</button>
    </div>
    <div class="pop-btn-row">
      <button class="pop-btn-edit" onclick="openEdit('${pt.id}')">✏️ Редактировать</button>
      <button class="pop-btn-del" onclick="delPoint('${pt.id}')">🗑️</button>
    </div>
  </div>`;
}

function renderMarker(pt){
  if(markers[pt.id]){markers[pt.id].remove();delete markers[pt.id]}
  if(filter!=='all'&&pt.cat!==filter)return;
  const m=L.marker([pt.lat,pt.lng],{icon:makeIcon(pt.cat)}).addTo(map);
  m.bindPopup(popupHtml(pt),{maxWidth:310});
  markers[pt.id]=m;
}

function renderAll(){
  Object.values(markers).forEach(m=>m.remove());
  markers={};
  points.forEach(renderMarker);
  updateCounts();updateHeader();
}

function updateCounts(){
  document.getElementById('cnt-all').textContent=points.length;
  Object.keys(CATS).forEach(cat=>{
    const el=document.getElementById(`cnt-${cat}`);
    if(el)el.textContent=points.filter(p=>p.cat===cat).length;
  });
}

function updateHeader(){
  const vis=filter==='all'?points.length:points.filter(p=>p.cat===filter).length;
  document.getElementById('hdr-sub').textContent=`${vis} ${plural(vis,'точка','точки','точек')}`;
}

// NAVIGATE
window.navigate=function(id){
  const pt=points.find(p=>p.id===id);if(!pt)return;
  map.closePopup();
  const url=`https://www.google.com/maps/dir/?api=1&destination=${pt.lat},${pt.lng}&travelmode=driving`;
  window.open(url,'_blank');
};

// SHARE
window.sharePoint=function(id){
  const pt=points.find(p=>p.id===id);if(!pt)return;
  map.closePopup();
  const cat=CATS[pt.cat]||CATS.other;
  const text=`${cat.icon} ${pt.name||'Место'}\n📍 ${fmtCoords(pt.lat,pt.lng)}\n🗺️ https://maps.google.com/?q=${pt.lat},${pt.lng}`;
  if(navigator.share){
    navigator.share({title:pt.name||'Моё место',text}).catch(()=>{});
  } else {
    navigator.clipboard.writeText(text).then(()=>showToast('📋 Скопировано в буфер')).catch(()=>showToast('⚠️ Не удалось скопировать'));
  }
};

// MARK VISIT
window.markVisit=function(id){
  const pt=points.find(p=>p.id===id);if(!pt)return;
  if(!pt.visits)pt.visits=[];
  pt.visits.push(Date.now());
  save(points);
  map.closePopup();
  setTimeout(()=>{if(markers[id])markers[id].openPopup()},100);
  showToast('✅ Визит отмечен!');
};

window.delPoint=function(id){
  map.closePopup();
  if(!confirm('Удалить эту точку?'))return;
  points=points.filter(p=>p.id!==id);
  save(points);renderAll();showToast('Точка удалена');
};

window.openEdit=function(id){
  map.closePopup();
  const pt=points.find(p=>p.id===id);if(!pt)return;
  editId=id;pendingLL={lat:pt.lat,lng:pt.lng};
  document.getElementById('sh-title').textContent='Изменить точку';
  document.getElementById('f-name').value=pt.name||'';
  document.getElementById('f-note').value=pt.note||'';
  document.getElementById('f-coords').textContent=fmtCoords(pt.lat,pt.lng);
  document.getElementById('sh-delete-row').style.display='block';
  selectCat(pt.cat);
  // фото
  photoData=pt.photo||null;
  renderPhotoArea();
  // визиты
  editVisits=pt.visits?[...pt.visits]:[];
  renderVisits();
  switchTab('main');
  openSheet();
};

// SHEET
function openSheet(){document.getElementById('overlay').classList.add('open');document.getElementById('sheet-add').classList.add('open')}
function closeSheet(){document.getElementById('overlay').classList.remove('open');document.getElementById('sheet-add').classList.remove('open');editId=null;pendingLL=null;photoData=null;editVisits=[];document.getElementById('sh-delete-row').style.display='none'}
function openSidebar(){renderSidebar();document.getElementById('sb-overlay').classList.add('open');document.getElementById('sidebar').classList.add('open')}
function closeSidebar(){document.getElementById('sb-overlay').classList.remove('open');document.getElementById('sidebar').classList.remove('open')}

// TABS
function switchTab(name){
  document.querySelectorAll('.sheet-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id===`tab-${name}`));
}
document.querySelectorAll('.sheet-tab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.tab)));

// CAT
function selectCat(cat){selCat=cat;document.querySelectorAll('.cat-item').forEach(el=>el.classList.toggle('sel',el.dataset.cat===cat))}
document.querySelectorAll('.cat-item').forEach(el=>el.addEventListener('click',()=>selectCat(el.dataset.cat)));

// PHOTO
function renderPhotoArea(){
  const area=document.getElementById('photo-area');
  const rem=document.getElementById('photo-remove');
  const existing=area.querySelector('img');
  if(existing)existing.remove();
  if(photoData){
    const img=document.createElement('img');img.src=photoData;area.prepend(img);
    rem.style.display='flex';
    area.querySelector('.ph-icon').style.display='none';
    area.querySelector('.ph-hint').style.display='none';
  } else {
    rem.style.display='none';
    area.querySelector('.ph-icon').style.display='block';
    area.querySelector('.ph-hint').style.display='block';
  }
}
document.getElementById('photo-area').addEventListener('click',e=>{if(e.target.id==='photo-remove')return;document.getElementById('photo-input').click()});
document.getElementById('photo-remove').addEventListener('click',e=>{e.stopPropagation();photoData=null;renderPhotoArea()});
document.getElementById('photo-input').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    // Сжимаем фото
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      const MAX=800;
      let w=img.width,h=img.height;
      if(w>h&&w>MAX){h=h*MAX/w;w=MAX}else if(h>MAX){w=w*MAX/h;h=MAX}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      photoData=canvas.toDataURL('image/jpeg',0.75);
      renderPhotoArea();
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value='';
});

// VISITS
function renderVisits(){
  const list=document.getElementById('visits-list');
  if(!editVisits.length){list.innerHTML='<div style="font-size:13px;color:var(--faint);padding:8px 0">Визитов пока нет</div>';return}
  list.innerHTML=editVisits.slice().reverse().map((ts,ri)=>{
    const i=editVisits.length-1-ri;
    return`<div class="visit-item"><span>${fmtDate(ts)}</span><button class="visit-del" onclick="removeVisit(${i})">✕</button></div>`;
  }).join('');
}
window.removeVisit=function(i){editVisits.splice(i,1);renderVisits()};
document.getElementById('add-visit').addEventListener('click',()=>{editVisits.push(Date.now());renderVisits();showToast('✅ Визит добавлен')});

// SAVE
document.getElementById('sh-save').addEventListener('click',()=>{
  if(!pendingLL)return showToast('⚠️ Нет координат');
  const name=document.getElementById('f-name').value.trim()||'Без названия';
  const note=document.getElementById('f-note').value.trim();
  if(editId){
    const pt=points.find(p=>p.id===editId);
    if(pt){pt.name=name;pt.note=note;pt.cat=selCat;pt.photo=photoData||null;pt.visits=editVisits;}
    showToast('✅ Точка обновлена');
  } else {
    points.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),lat:pendingLL.lat,lng:pendingLL.lng,name,note,cat:selCat,photo:photoData||null,visits:editVisits,ts:Date.now()});
    showToast('📍 Точка добавлена');
  }
  save(points);closeSheet();renderAll();
});

document.getElementById('sh-delete').addEventListener('click',()=>{
  if(!editId)return;
  if(!confirm('Удалить эту точку?'))return;
  points=points.filter(p=>p.id!==editId);
  save(points);closeSheet();renderAll();showToast('Точка удалена');
});

document.getElementById('sh-close').addEventListener('click',closeSheet);
document.getElementById('sh-cancel').addEventListener('click',closeSheet);
document.getElementById('overlay').addEventListener('click',closeSheet);

// SIDEBAR
function renderSidebar(q=''){
  const list=document.getElementById('sb-list');
  let pts=filter==='all'?points:points.filter(p=>p.cat===filter);
  if(q)pts=pts.filter(p=>(p.name||'').toLowerCase().includes(q.toLowerCase())||(p.note||'').toLowerCase().includes(q.toLowerCase()));
  pts=pts.slice().sort((a,b)=>{
    if(userPos){return dist(userPos.lat,userPos.lng,a.lat,a.lng)-dist(userPos.lat,userPos.lng,b.lat,b.lng)}
    return b.ts-a.ts;
  });
  if(!pts.length){list.innerHTML=`<div class="sb-empty"><span class="se-icon">${q?'🔍':'🗺️'}</span>${q?'Ничего не найдено':'Нет точек.\nТапни по карте чтобы добавить!'}</div>`;return}
  list.innerHTML=pts.map(pt=>{
    const cat=CATS[pt.cat]||CATS.other;
    const d=userPos?fmtDist(dist(userPos.lat,userPos.lng,pt.lat,pt.lng)):'';
    return`<div class="sb-item" onclick="flyTo('${pt.id}')">
      <div class="sb-icon" style="background:${cat.bg}">${cat.icon}</div>
      <div class="sb-info">
        <div class="sb-name">${escHtml(pt.name||'Без названия')}</div>
        <div class="sb-meta">${cat.label} · ${fmtDate(pt.ts)}</div>
        ${d?`<div class="sb-dist">📏 ${d}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

window.flyTo=function(id){
  const pt=points.find(p=>p.id===id);if(!pt)return;
  closeSidebar();
  map.flyTo([pt.lat,pt.lng],16,{duration:1});
  setTimeout(()=>{if(markers[id])markers[id].openPopup()},1100);
};

document.getElementById('fab-list').addEventListener('click',openSidebar);
document.getElementById('sb-close').addEventListener('click',closeSidebar);
document.getElementById('sb-overlay').addEventListener('click',closeSidebar);
document.getElementById('sb-q').addEventListener('input',e=>renderSidebar(e.target.value));

// FAB ADD
document.getElementById('fab-add').addEventListener('click',()=>{
  const c=map.getCenter();pendingLL={lat:c.lat,lng:c.lng};editId=null;photoData=null;editVisits=[];
  document.getElementById('sh-title').textContent='Новая точка';
  document.getElementById('f-name').value='';document.getElementById('f-note').value='';
  document.getElementById('f-coords').textContent=fmtCoords(c.lat,c.lng);
  selectCat('mushroom');renderPhotoArea();renderVisits();switchTab('main');openSheet();
});

map.on('click',e=>{
  pendingLL={lat:e.latlng.lat,lng:e.latlng.lng};editId=null;photoData=null;editVisits=[];
  document.getElementById('sh-title').textContent='Новая точка';
  document.getElementById('f-name').value='';document.getElementById('f-note').value='';
  document.getElementById('f-coords').textContent=fmtCoords(e.latlng.lat,e.latlng.lng);
  selectCat('mushroom');renderPhotoArea();renderVisits();switchTab('main');openSheet();
});

// GPS
document.getElementById('fab-gps').addEventListener('click',()=>{
  if(userPos){map.flyTo([userPos.lat,userPos.lng],15,{duration:1});showToast('📍 Ваше местоположение');}
  else{showToast('📡 Определяю GPS...');navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{map.flyTo([p.coords.latitude,p.coords.longitude],15,{duration:1});showToast('✅ Найдено')},()=>showToast('⚠️ GPS недоступен'));}
});

// FILTERS
document.querySelectorAll('.f-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.f-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');filter=b.dataset.cat;renderAll();renderSidebar(document.getElementById('sb-q').value);
  });
});

// EXPORT/IMPORT
document.getElementById('btn-export').addEventListener('click',()=>{
  if(!points.length)return showToast('⚠️ Нет точек');
  const data=JSON.stringify({version:2,exported:new Date().toISOString(),points},null,2);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
  a.download=`moi-mesta-${new Date().toISOString().slice(0,10)}.json`;a.click();
  showToast(`💾 Сохранено ${points.length} точек`);
});
document.getElementById('btn-import').addEventListener('click',()=>document.getElementById('import-input').click());
document.getElementById('import-input').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{try{const data=JSON.parse(ev.target.result);const imported=data.points||data;if(!Array.isArray(imported))throw 0;const ex=new Set(points.map(p=>p.id));let added=0;imported.forEach(pt=>{if(!ex.has(pt.id)){points.push(pt);added++}});save(points);renderAll();showToast(`✅ Добавлено ${added} точек`);}catch{showToast('⚠️ Ошибка файла')}};
  reader.readAsText(file);e.target.value='';
});

// СПРАВОЧНИК
function renderRef(section,itemIdx){
  const body=document.getElementById('ref-body');
  if(itemIdx!==undefined){
    const item=(section==='mushrooms'?REF.mushrooms:REF.fish)[itemIdx];
    body.innerHTML=`<div class="ref-detail">
      <button class="ref-back" onclick="renderRef('${section}')">← Назад</button>
      <div style="font-size:48px;margin-bottom:8px">${item.icon}</div>
      <h3>${item.name}</h3>
      <div class="rd-sub">📅 ${item.season} · 📍 ${item.where}</div>
      <p>${item.desc}</p>
      <div>${item.tags.map(t=>`<span class="rd-tag">${t}</span>`).join('')}</div>
    </div>`;
    return;
  }
  if(section){
    const items=section==='mushrooms'?REF.mushrooms:REF.fish;
    const title=section==='mushrooms'?'🍄 Грибы':'🐟 Рыба';
    body.innerHTML=`<div class="ref-detail">
      <button class="ref-back" onclick="renderRef()">← Назад</button>
      <h3 style="margin-bottom:16px">${title}</h3>
      <div class="ref-grid">${items.map((it,i)=>`<div class="ref-card" onclick="renderRef('${section}',${i})">
        <div class="rc-icon">${it.icon}</div>
        <div class="rc-name">${it.name}</div>
        <div class="rc-desc">${it.season}</div>
      </div>`).join('')}</div>
    </div>`;
    return;
  }
  body.innerHTML=`<div class="sheet-body">
    <div class="ref-grid" style="margin-bottom:16px">
      <div class="ref-card" onclick="renderRef('mushrooms')"><div class="rc-icon">🍄</div><div class="rc-name">Грибы</div><div class="rc-desc">${REF.mushrooms.length} видов</div></div>
      <div class="ref-card" onclick="renderRef('fish')"><div class="rc-icon">🐟</div><div class="rc-name">Рыба</div><div class="rc-desc">${REF.fish.length} видов</div></div>
    </div>
  </div>`;
}
window.renderRef=renderRef;

document.getElementById('btn-ref').addEventListener('click',()=>{
  renderRef();
  document.getElementById('ref-overlay').classList.add('open');
  document.getElementById('sheet-ref').classList.add('open');
});
document.getElementById('ref-close').addEventListener('click',()=>{
  document.getElementById('ref-overlay').classList.remove('open');
  document.getElementById('sheet-ref').classList.remove('open');
});
document.getElementById('ref-overlay').addEventListener('click',()=>{
  document.getElementById('ref-overlay').classList.remove('open');
  document.getElementById('sheet-ref').classList.remove('open');
});

// СЕЗОННЫЕ НАПОМИНАНИЯ
const SEASONS=[
  {months:[6,7,8,9],icon:'🍄',text:'Сезон белых грибов и лисичек!'},
  {months:[7,8],icon:'🫐',text:'Сезон черники и голубики!'},
  {months:[8,9,10],icon:'🍄',text:'Сезон опят и груздей!'},
  {months:[3,4],icon:'🎣',text:'Открытие рыболовного сезона!'},
  {months:[10,11],icon:'🦌',text:'Осенний охотничий сезон!'},
];
function checkSeason(){
  const m=new Date().getMonth();
  const dismissed=JSON.parse(localStorage.getItem('season_dismissed')||'{}');
  const banner=document.getElementById('season-banner');
  for(const s of SEASONS){
    if(s.months.includes(m)&&!dismissed[s.text]){
      document.getElementById('season-icon').textContent=s.icon;
      document.getElementById('season-text').textContent=s.text;
      banner.classList.remove('hidden');
      document.getElementById('season-dismiss').onclick=()=>{
        banner.classList.add('hidden');
        dismissed[s.text]=true;
        localStorage.setItem('season_dismissed',JSON.stringify(dismissed));
      };
      return;
    }
  }
  banner.classList.add('hidden');
}

// TOAST
let toastTimer;
function showToast(msg){
  const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2500);
}

// PWA
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});

checkSeason();
renderAll();
</script>
